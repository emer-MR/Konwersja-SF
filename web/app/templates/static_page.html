{% extends "base.html" %}

{% block title %}{{ page.title }} - Konwerter SF{% endblock %}

{% block content %}
<article>
    <header>
        <h1>{{ page.title }}</h1>
    </header>

    <div class="page-content">
        {{ page.content | safe }}
    </div>
</article>

<style>
    .page-content {
        line-height: 1.8;
    }

    .page-content img {
        max-width: 100%;
        height: auto;
        border-radius: var(--pico-border-radius);
    }

    .page-content h2, .page-content h3 {
        margin-top: 2rem;
    }
</style>
{% endblock %}
