{% extends "base.html" %}

{% block title %}Rejestracja - Konwerter SF{% endblock %}

{% block content %}
<article>
    <header>
        <h2>Rejestracja</h2>
    </header>

    {% if error %}
    <div class="alert alert-error">
        {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success">
        {{ success }}
    </div>
    {% endif %}

    <form method="post" action="/register">
        <label for="email">
            Email
            <input
                type="email"
                id="email"
                name="email"
                placeholder="jan@example.com"
                required
                autocomplete="email"
            >
        </label>

        <label for="password">
            Hasło
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 znaków"
                minlength="8"
                required
                autocomplete="new-password"
            >
        </label>

        <label for="password_confirm">
            Potwierdź hasło
            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                placeholder="Powtórz hasło"
                minlength="8"
                required
                autocomplete="new-password"
            >
        </label>

        <button type="submit">Zarejestruj się</button>
    </form>

    <footer>
        <p>Masz już konto? <a href="/login">Zaloguj się</a></p>
    </footer>
</article>
{% endblock %}
