# Konfiguracja Nginx dla konwersja.analizy.io
#
# Instalacja na VPS:
#   1. Skopiuj ten plik do /etc/nginx/sites-available/
#   2. Utwórz symlink: ln -s /etc/nginx/sites-available/konwersja.analizy.io.conf /etc/nginx/sites-enabled/
#   3. Sprawdź konfigurację: nginx -t
#   4. Przeładuj: systemctl reload nginx
#   5. Uzyskaj certyfikat SSL: certbot --nginx -d konwersja.analizy.io

server {
    listen 80;
    listen [::]:80;
    server_name konwersja.analizy.io;

    # Przekierowanie na HTTPS (certbot doda to automatycznie)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Nagłówki WebSocket (dla ewentualnych przyszłych funkcji)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Nagłówki proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouty (konwersja plików może trwać dłużej)
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Maksymalny rozmiar uploadu (15MB + margines)
        client_max_body_size 20M;

        # Buforowanie
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # Statyczne pliki - cache
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Healthcheck endpoint
    location /health {
        proxy_pass http://127.0.0.1:8080/docs;
        proxy_set_header Host $host;
        access_log off;
    }
}
