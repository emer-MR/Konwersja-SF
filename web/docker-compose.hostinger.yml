# Docker Compose dla Hostinger VPS - Czytnik SF
# Domena: czytnik.analizy.io
#
# Użycie przez SSH:
#   docker compose -f docker-compose.hostinger.yml up -d

version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile.prod
    container_name: czytnik-sf
    restart: unless-stopped

    # Traefik Labels - KLUCZOWE DLA DZIAŁANIA DOMENY
    labels:
      - traefik.enable=true
      - traefik.http.routers.czytnik.rule=Host(`czytnik.analizy.io`)
      - traefik.http.routers.czytnik.tls=true
      - traefik.http.routers.czytnik.entrypoints=web,websecure
      - traefik.http.routers.czytnik.tls.certresolver=mytlschallenge
      - traefik.http.services.czytnik.loadbalancer.server.port=8000
      - traefik.docker.network=root_default

    networks:
      - default
      - traefik_network

    environment:
      # Wymagane - uzupełnij w Docker Manager lub pliku .env
      - SECRET_KEY=${SECRET_KEY:-ZMIEN_NA_PRODUKCJI}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}

      # Google Analytics
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID:-G-BD3959F2HL}

      # Opcjonalne - domyślne wartości
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-15}
      - ADMIN_FILE_RETENTION_DAYS=${ADMIN_FILE_RETENTION_DAYS:-0}
      - DEBUG=${DEBUG:-false}

      # Dane kontaktowe
      - CONTACT_EMAIL=${CONTACT_EMAIL:-kontakt@analizy.io}
      - CONTACT_ADDRESS=${CONTACT_ADDRESS:-}

    volumes:
      - czytnik_data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  czytnik_data:
    driver: local

networks:
  traefik_network:
    external: true
    name: root_default
