# Docker Compose dla Hostinger VPS
# Może być użyty przez Docker Manager (GUI) lub SSH
#
# Użycie przez Docker Manager:
#   1. Wklej URL: https://raw.githubusercontent.com/emer-MR/Konwersja-SF/main/web/docker-compose.hostinger.yml
#   2. Uzupełnij zmienne środowiskowe w formularzu
#
# Użycie przez SSH:
#   docker compose -f docker-compose.hostinger.yml up -d

version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile.prod
    container_name: konwerter-sf
    restart: unless-stopped

    ports:
      - "8080:8000"

    environment:
      # Wymagane - uzupełnij w Docker Manager lub pliku .env
      - SECRET_KEY=${SECRET_KEY:-ZMIEN_NA_PRODUKCJI}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}

      # Opcjonalne - domyślne wartości
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
      - MAX_CONVERSIONS_PER_DAY=${MAX_CONVERSIONS_PER_DAY:-20}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-15}
      - DEBUG=${DEBUG:-false}

    volumes:
      - konwerter_data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  konwerter_data:
    driver: local
